steps:
  # 1. Recuperar o arquivo .env a partir do Google Secret Manager (projeto Hub: my-project-default-316319)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud secrets versions access latest --secret=dotenv-quotes > .env
        echo "✔ Arquivo .env carregado com sucesso a partir do Secret Manager."

  # 2. Instalar dependências da aplicação React e das Cloud Functions
  - name: 'node:20'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        npm ci || npm install
        if [ -d "functions" ]; then
          npm --prefix functions ci || npm --prefix functions install
        fi

  # 3. Compilar Frontend e Backend, e fazer deploy no Firebase
  - name: 'node:20'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        TARGET_PROJECT=$$(grep -E '^(VITE_FIREBASE_PROJECT_ID|PROJECT_ID)' .env 2>/dev/null | head -n 1 | cut -d'=' -f2 | tr -d ' "\r\n')
        if [ -z "$$TARGET_PROJECT" ]; then
          TARGET_PROJECT="quotes-vitor"
        fi
        echo "🚀 Iniciando deploy completo para o projeto Firebase: $${TARGET_PROJECT}"

        # Deploy no Firebase (o predeploy em firebase.json irá incrementar a versão e rodar o build)
        npx -y firebase-tools deploy --only hosting,functions,firestore:rules --non-interactive --project "$${TARGET_PROJECT}"

options:
  logging: CLOUD_LOGGING_ONLY
